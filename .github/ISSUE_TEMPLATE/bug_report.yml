name: Bug report
description: Something looks wrong or stutters
labels: [bug]
body:
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and driver
      placeholder: RTX 3060, 616.92
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Tail of godot.log
      description: "%APPDATA%\\Godot\\app_userdata\\Mukyeon\\logs\\godot.log"
      render: text
