name: Render demo video

# Renders docs/demo.mp4 with Godot's Movie Maker on a software GL driver.
# Run it by hand from the Actions tab; the files come back as an artifact.
on:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers libgl1-mesa-dri libglx-mesa0 ffmpeg
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          echo "GODOT=$PWD/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Import project
        run: $GODOT --headless --path . --import

      - name: Record 30 s at 60 fps
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p out
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            $GODOT --path . --rendering-driver opengl3 --write-movie out/demo.avi --fixed-fps 60 --quit-after 1800 \
            -- --windowed --demo 2>&1 | tail -n 30

      - name: Encode
        run: |
          ffmpeg -y -i out/demo.avi -vf "fade=t=in:st=0:d=1.2,fade=t=out:st=28.8:d=1.2" \
            -c:v libx264 -preset slow -crf 20 -pix_fmt yuv420p -movflags +faststart out/demo.mp4
          ffmpeg -y -i out/demo.mp4 -vf "fps=14,scale=800:-1:flags=lanczos,split[a][b];[a]palettegen=max_colors=96[p];[b][p]paletteuse=dither=bayer:bayer_scale=4" out/demo.gif
          ffmpeg -y -ss 23 -i out/demo.mp4 -frames:v 1 out/screenshot.png
          ls -la out

      - uses: actions/upload-artifact@v7
        with:
          name: demo
          path: |
            out/demo.mp4
            out/demo.gif
            out/screenshot.png
